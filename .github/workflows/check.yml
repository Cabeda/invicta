name: Check application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node 24
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install numpy==2.5.4 pyproj==3.8.0 eclipse-sumo==1.28.0 sumolib==1.28.0 traci==1.28.0 libsumo==1.28.0
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
