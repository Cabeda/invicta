const backgroundCache=new Map();function background(policy,w,h){const key=[policy,state.camera,w,h].join('|');if(backgroundCache.has(key))return backgroundCache.get(key);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),box=D.cameras[state.camera],project=projection(box,w,h);x.fillStyle='#f7f9f4';x.fillRect(0,0,w,h);for(const e of D.geometry){if(!e.shape.some(p=>p[0]>=box[0]-100&&p[0]<=box[2]+100&&p[1]>=box[1]-100&&p[1]<=box[3]+100))continue;x.strokeStyle='#d3ddd4';x.lineWidth=1.6;x.beginPath();e.shape.forEach((p,i)=>{const a=project(p);i?x.lineTo(...a):x.moveTo(...a)});x.stroke()}for(const e of D.geometry.filter(e=>e.corridor)){x.strokeStyle=policy==='restricted'?'#177455':'#879585';x.lineWidth=5;x.beginPath();e.shape.forEach((p,i)=>{const a=project(p);i?x.lineTo(...a):x.moveTo(...a)});x.stroke()}x.font='600 12px system-ui';for(const l of D.labels){const [px,py]=project(l.point);if(px<10||px>w-10||py<15||py>h-10)continue;x.beginPath();x.fillStyle='white';x.arc(px,py,3,0,Math.PI*2);x.fill();x.strokeStyle='#177455';x.lineWidth=1.5;x.stroke();const tx=Math.min(px+8,w-125);x.lineWidth=4;x.strokeStyle='#f7f9f4';x.strokeText(l.name,tx,py-9);x.fillStyle='#173b31';x.fillText(l.name,tx,py-9)}x.fillStyle='#173b31';x.font='12px system-ui';x.fillText('N ↑',w-38,23);backgroundCache.set(key,c);return c}

function updateMetrics(){const a=D.stats[state.case].baseline,b=D.stats[state.case].restricted;$('busMetric').textContent=`${fmt(a.bus_minutes)} → ${fmt(b.bus_minutes)} min`;$('residentMetric').textContent=`${fmt(a.resident_minutes)} → ${fmt(b.resident_minutes)} min`;$('unroutableMetric').textContent=fmt(b.no_route);$('completionNote').textContent=state.lang==='pt'?`Pedidos não servidos (média): ${fmt(a.unserved)} na referência; ${fmt(b.unserved)} na proposta. Inclui falta de percurso, não inseridos e viagens por concluir. O replay e os números resumem períodos diferentes, identificados acima.`:`Unserved requests (mean): ${fmt(a.unserved)} in the baseline; ${fmt(b.unserved)} in the proposal. Includes no-route, not-inserted and unfinished trips. Replay and metric periods differ, as identified above.`;}

$('ptBtn').onclick=()=>{state.lang='pt';renderUI()};$('enBtn').onclick=()=>{state.lang='en';renderUI()};$('playBtn').onclick=()=>{if(state.time>=1440)state.time=720;state.playing=!state.playing;renderUI()};$('caseSelect').onchange=e=>{state.case=e.target.value;renderUI()};$('cameraSelect').onchange=e=>{state.camera=e.target.value;renderUI()};$('viewSelect').onchange=e=>{state.view=e.target.value;renderUI()};$('speedSelect').onchange=e=>{state.speed=Number(e.target.value)};$('timeSlider').oninput=e=>{state.time=Number(e.target.value);draw()};
function drawRecording(){const c=captureCanvas,x=captureContext;x.fillStyle='#f4f5ee';x.fillRect(0,0,c.width,c.height);x.fillStyle='#173b31';x.font='bold 42px system-ui';x.fillText('Rua de Costa Cabral',50,65);x.font='20px system-ui';x.fillStyle='#637466';x.fillText(tr('exportNote'),50,105);const panels=state.view==='compare'?['baseline','restricted']:[state.view],pw=(c.width-120-(panels.length-1)*30)/panels.length,ph=755;for(let i=0;i<panels.length;i++){const off=recordingMapCanvases[i]||(recordingMapCanvases[i]=document.createElement('canvas'));if(off.width!==Math.floor(pw)||off.height!==ph){off.width=Math.floor(pw);off.height=ph}drawMap(off.getContext('2d'),panels[i],off.width,ph,state.time);const px=60+i*(pw+30);x.drawImage(off,px,190);x.fillStyle='#173b31';x.font='bold 23px system-ui';x.fillText(tr(panels[i]),px,168)}x.fillStyle='#173b31';x.font='bold 26px system-ui';x.fillText(`${clock(state.time)} · ${tr(state.case==='moderate'?'moderate':state.case==='busy'?'busy':'residents')} · seed 17`,60,994);x.font='18px system-ui';x.fillStyle='#637466';x.fillText(tr('symbolNote'),60,1035)}
